<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="图片水印">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#0ea5e9" />
    </linearGradient>

    <pattern id="wm" width="150" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(45 256 256)">
      <text
        x="8"
        y="82"
        font-family="PingFang SC, Hiragino Sans GB, STHeiti, Heiti SC, Microsoft YaHei, sans-serif"
        font-size="52"
        font-weight="700"
        fill="#ffffff"
        fill-opacity="0.5"
      >水印</text>
    </pattern>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="url(#wm)" />
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" />
</svg>
